[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dictate"
version = "0.2.0"
description = "Private, offline push-to-talk dictation: press a key, speak, and your words are typed where your cursor is."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "nitinreddy08" }]
keywords = ["dictation", "speech-to-text", "whisper", "offline", "accessibility"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1",
    "numpy",
    "rich>=13.7",
    "psutil>=5.9",
    "PySide6-Essentials>=6.7; sys_platform == 'win32'",
    "sounddevice>=0.4.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dictate = "dictate_cli.cli:main"

[project.gui-scripts]
dictate-app = "dictate_win.app:main"

[project.urls]
Source = "https://github.com/nitinreddy08/dictate"

[tool.setuptools]
packages = ["dictate_core", "dictate_win", "dictate_cli"]

[tool.setuptools.package-data]
dictate_core = ["assets/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
